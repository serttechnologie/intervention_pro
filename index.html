<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>InterventionPro Ultra</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #05070a; --card: #12161f; --accent: #ff6b2b; --accent-glow: rgba(255,107,43,0.3);
  --text: #ffffff; --muted: #808ba0; --success: #00ff88; --border: rgba(255,255,255,0.08);
  --radius: 18px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; }

.hdr { position: sticky; top: 0; z-index: 100; background: rgba(5,7,10,0.8); backdrop-filter: blur(15px); padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.logo { font-weight: 800; font-size: 1.2rem; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
.logo span { color: var(--accent); }

.view { display: none; padding: 20px; max-width: 600px; margin: 0 auto; animation: fadeIn 0.3s ease; }
.view.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.btn { border: none; border-radius: var(--radius); font-weight: 700; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; }
.btn-primary { background: linear-gradient(135deg, var(--accent), #ff9060); color: white; padding: 14px 24px; box-shadow: 0 8px 20px var(--accent-glow); }
.btn-secondary { background: var(--card); border: 1px solid var(--border); color: white; padding: 12px 20px; }
.btn-green { background: rgba(0,255,136,0.15); color: var(--success); border: 1px solid rgba(0,255,136,0.3); padding: 12px 20px; }
.btn-danger { background: rgba(255, 60, 60, 0.15); color: #ff5050; padding: 12px; }
.btn:active { transform: scale(0.96); opacity: 0.8; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 25px; }
.stat-card { background: var(--card); padding: 15px; border-radius: var(--radius); border: 1px solid var(--border); text-align: center; }
.stat-val { display: block; font-size: 1.5rem; font-weight: 800; color: var(--accent); font-family: 'JetBrains Mono'; }
.stat-lbl { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-bottom: 12px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.2s; }
.card:active { transform: scale(0.98); }
.card-icon { width: 45px; height: 45px; background: rgba(255,107,43,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--accent); font-weight: 800; font-size: 1rem; }

.folder-banner { border-radius: 12px; padding: 12px 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; font-size: 0.85rem; }
.folder-banner.linked { background: rgba(0,255,136,0.1); border: 1px solid rgba(0,255,136,0.25); color: var(--success); }
.folder-banner.unlinked { background: rgba(255,107,43,0.1); border: 1px solid rgba(255,107,43,0.25); color: var(--accent); }
.folder-banner-icon { font-size: 1.4rem; flex-shrink: 0; }
.folder-banner-info { flex: 1; }
.folder-banner-title { font-weight: 700; }
.folder-banner-sub { font-size: 0.75rem; opacity: 0.75; margin-top: 2px; }

.photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.photo-item { aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--card); border: 1px solid var(--border); cursor: pointer; }
.photo-item img { width: 100%; height: 100%; object-fit: cover; }

.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 1000; padding: 20px; align-items: center; justify-content: center; }
.modal { background: var(--card); width: 100%; max-width: 450px; border-radius: 24px; padding: 30px; border: 1px solid var(--border); }
.modal h3 { margin-bottom: 20px; font-size: 1.2rem; }
.modal input { width: 100%; padding: 16px; background: #1a1f2b; border: 1px solid var(--border); border-radius: 12px; color: white; margin-bottom: 14px; font-size: 1rem; font-family: inherit; outline: none; }
.modal input:focus { border-color: var(--accent); }

.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 1000; align-items: center; justify-content: center; flex-direction: column; gap: 20px; }
.lightbox img { max-width: 95vw; max-height: 75vh; border-radius: 15px; object-fit: contain; }

.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1a1f2b; color: white; border: 1px solid var(--border); padding: 12px 24px; border-radius: 30px; font-size: 0.85rem; font-weight: 600; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 9999; white-space: nowrap; max-width: 90vw; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
.toast.show { opacity: 1; }

.no-photos { text-align: center; padding: 3rem 1rem; color: var(--muted); }
.no-photos-icon { font-size: 3rem; display: block; margin-bottom: 12px; }
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">&#128247; <span>INTER</span>PRO</div>
  <span id="hdr-count" style="font-size:0.8rem;color:var(--muted);">0 intervention</span>
</div>

<!-- LIST -->
<div class="view active" id="v-list">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
    <h1 style="font-size:1.5rem">Interventions</h1>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-green" onclick="openExistingFolder()" style="font-size:0.8rem;padding:10px 14px;">&#128194; Ouvrir</button>
      <button class="btn btn-primary" onclick="showModal('m-create')">+ Nouveau</button>
    </div>
  </div>
  <div class="stat-grid">
    <div class="stat-card"><span class="stat-val" id="s-total">0</span><span class="stat-lbl">Dossiers</span></div>
    <div class="stat-card"><span class="stat-val" id="s-photos">0</span><span class="stat-lbl">Photos</span></div>
    <div class="stat-card"><span class="stat-val" id="s-linked">0</span><span class="stat-lbl">Lies</span></div>
  </div>
  <div id="list-container"></div>
</div>

<!-- DETAIL -->
<div class="view" id="v-detail">
  <div style="display:flex;align-items:center;gap:15px;margin-bottom:20px;">
    <button class="btn btn-secondary" onclick="goHome()" style="padding:10px 16px;">&#8592;</button>
    <div style="flex:1">
      <h2 id="d-title" style="font-size:1.2rem;margin-bottom:2px">---</h2>
      <p id="d-subtitle" style="color:var(--muted);font-size:0.8rem">---</p>
    </div>
    <button class="btn btn-danger" onclick="deleteCurrent()">&#128465;</button>
  </div>

  <div id="folder-banner-container"></div>

  <div style="display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:20px;">
    <button class="btn btn-primary" id="btn-photo" onclick="capturePhoto()">&#128247; Prendre une photo</button>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
    <span style="font-size:0.85rem;color:var(--muted);">Photos enregistrees</span>
    <span id="d-count" style="font-weight:800;font-family:'JetBrains Mono';color:var(--accent);">0</span>
  </div>

  <div id="grid"></div>
  <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none"/>
</div>

<!-- MODAL CREATION -->
<div class="overlay" id="m-create">
  <div class="modal">
    <h3>Nouvelle Intervention</h3>
    <input type="text" id="in-num" placeholder="N Intervention (ex: 2026-001)" autocomplete="off"/>
    <input type="text" id="in-client" placeholder="Client / Site" autocomplete="off"/>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;">
      <button class="btn btn-secondary" onclick="hideModals()">ANNULER</button>
      <button class="btn btn-primary" onclick="addIntervention()">CREER</button>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <img id="lb-img" src="" alt=""/>
  <button class="btn btn-secondary" onclick="hideLightbox()">FERMER</button>
</div>

<div class="toast" id="toast"></div>

<script>
// ---- State ----
var interventions = JSON.parse(localStorage.getItem('ipro_v2') || '[]');
var currentId = null;
var folderHandles = {}; // RAM only
var photoPreviews = {}; // RAM only: id -> [{name, url}]

// ---- Init ----
renderList();

// ---- Toast ----
function showToast(msg, duration) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, duration || 2800);
}

// ---- Save ----
function saveData() {
  localStorage.setItem('ipro_v2', JSON.stringify(interventions.map(function(i) {
    return { id: i.id, num: i.num, client: i.client, date: i.date, photoCount: i.photoCount, folderName: i.folderName };
  })));
}

// ---- Folder name builder ----
function buildFolderName(num, client) {
  return (num + '_' + client)
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-zA-Z0-9_\- ]/g, '')
    .replace(/\s+/g, '_')
    .replace(/_+/g, '_')
    .replace(/^_|_$/g, '');
}

// ---- Modals ----
function showModal(id) { document.getElementById(id).style.display = 'flex'; }
function hideModals() { document.querySelectorAll('.overlay').forEach(function(o){ o.style.display = 'none'; }); }

// ---- Lightbox ----
function openLightbox(url) { document.getElementById('lb-img').src = url; document.getElementById('lightbox').style.display = 'flex'; }
function hideLightbox() { document.getElementById('lightbox').style.display = 'none'; }

// ---- Ouvrir un dossier existant ----
async function openExistingFolder() {
  if (!window.showDirectoryPicker) { showToast('Utilise Chrome Android !'); return; }
  try {
    showToast('Choisis le dossier de l'intervention...');
    // L'utilisateur choisit DIRECTEMENT le sous-dossier (ex: INT-042_Dupont_Jean)
    var subDir = await window.showDirectoryPicker({ mode: 'readwrite' });
    var folderName = subDir.name;

    // Verifier si cette intervention existe deja
    var existing = interventions.find(function(i){ return i.folderName === folderName; });

    if (existing) {
      // Deja dans la liste — juste reconnecter
      folderHandles[existing.id] = subDir;
      showToast('Dossier retrouve : ' + folderName);
      openFolder(existing.id);
      return;
    }

    // Nouveau — extraire num et client depuis le nom du dossier
    // Format attendu : NUM_CLIENT (ex: INT-042_Dupont_Jean)
    var parts = folderName.split('_');
    var num = parts[0] || folderName;
    var client = parts.slice(1).join(' ') || 'Inconnu';

    // Compter les photos existantes dans le dossier
    var photoCount = 0;
    try {
      for await (var entry of subDir.values()) {
        if (entry.kind === 'file') photoCount++;
      }
    } catch(e) {}

    var inv = {
      id: Date.now(),
      num: num,
      client: client,
      date: new Date().toLocaleDateString('fr-FR'),
      photoCount: photoCount,
      folderName: folderName
    };

    interventions.push(inv);
    folderHandles[inv.id] = subDir;
    saveData();
    renderList();
    showToast('Dossier ouvert : ' + folderName + ' (' + photoCount + ' photo' + (photoCount > 1 ? 's' : '') + ')');
    openFolder(inv.id);
  } catch(e) {
    if (e.name !== 'AbortError') showToast('Erreur : ' + e.message);
  }
}

// ---- Render list ----
function renderList() {
  var cont = document.getElementById('list-container');
  var count = interventions.length;
  var totalPhotos = interventions.reduce(function(a, b){ return a + (b.photoCount || 0); }, 0);
  var linked = Object.keys(folderHandles).length;

  document.getElementById('hdr-count').textContent = count + ' intervention' + (count > 1 ? 's' : '');
  document.getElementById('s-total').textContent = count;
  document.getElementById('s-photos').textContent = totalPhotos;
  document.getElementById('s-linked').textContent = linked;

  if (!count) {
    cont.innerHTML = '<div class="no-photos"><span class="no-photos-icon">&#128193;</span><p>Aucune intervention.<br>Cree-en une !</p></div>';
    return;
  }

  cont.innerHTML = interventions.slice().reverse().map(function(i) {
    var isLinked = !!folderHandles[i.id];
    return '<div class="card" onclick="openFolder(' + i.id + ')">' +
      '<div class="card-icon">' + esc(i.num).slice(0,3) + '</div>' +
      '<div style="flex:1">' +
        '<div style="font-weight:700">' + esc(i.num) + '</div>' +
        '<div style="color:var(--muted);font-size:0.8rem">' + esc(i.client) + ' &mdash; ' + i.date + '</div>' +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:8px;">' +
        '<span style="font-family:JetBrains Mono;color:var(--accent);font-weight:800">' + (i.photoCount || 0) + '</span>' +
        '<span style="font-size:0.7rem;padding:2px 8px;border-radius:20px;' + (isLinked ? 'background:rgba(0,255,136,0.1);color:var(--success)' : 'background:rgba(255,107,43,0.1);color:var(--accent)') + '">' + (isLinked ? 'LIE' : 'NON LIE') + '</span>' +
      '</div>' +
    '</div>';
  }).join('');
}

// ---- Add intervention ----
async function addIntervention() {
  var num = document.getElementById('in-num').value.trim();
  var cli = document.getElementById('in-client').value.trim();
  if (!num || !cli) { showToast('Remplis les deux champs !'); return; }

  if (!window.showDirectoryPicker) { showToast('Utilise Chrome Android !'); return; }

  try {
    hideModals();
    showToast('Choisis le dossier parent...');
    var parentHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    var folderName = buildFolderName(num, cli);
    var subDir = await parentHandle.getDirectoryHandle(folderName, { create: true });

    var inv = { id: Date.now(), num: num, client: cli, date: new Date().toLocaleDateString('fr-FR'), photoCount: 0, folderName: folderName };
    interventions.push(inv);
    folderHandles[inv.id] = subDir;
    saveData();
    renderList();
    showToast('Dossier cree : ' + folderName);
    openFolder(inv.id);
  } catch(e) {
    if (e.name !== 'AbortError') showToast('Erreur : ' + e.message);
  }
}

// ---- Open folder ----
function openFolder(id) {
  currentId = id;
  var inv = interventions.find(function(x){ return x.id === id; });
  if (!inv) return;
  document.getElementById('d-title').textContent = inv.num;
  document.getElementById('d-subtitle').textContent = inv.client + ' — ' + inv.date + ' — ' + (inv.folderName || '');
  document.getElementById('v-list').classList.remove('active');
  document.getElementById('v-detail').classList.add('active');
  renderFolderBanner(inv);
  renderGrid(inv);
}

// ---- Folder banner ----
function renderFolderBanner(inv) {
  var el = document.getElementById('folder-banner-container');
  var btn = document.getElementById('btn-photo');
  var isLinked = !!folderHandles[inv.id];

  if (isLinked) {
    el.innerHTML = '<div class="folder-banner linked">' +
      '<div class="folder-banner-icon">&#128194;</div>' +
      '<div class="folder-banner-info"><div class="folder-banner-title">' + esc(inv.folderName) + '</div><div class="folder-banner-sub">Dossier lie &mdash; photos enregistrees directement</div></div>' +
      '</div>';
    btn.disabled = false;
  } else {
    el.innerHTML = '<div class="folder-banner unlinked">' +
      '<div class="folder-banner-icon">&#128279;</div>' +
      '<div class="folder-banner-info"><div class="folder-banner-title">Dossier non lie</div><div class="folder-banner-sub">Choisis le dossier parent contenant <strong>' + esc(inv.folderName || inv.num) + '</strong></div></div>' +
      '<button class="btn btn-green" style="padding:8px 14px;font-size:0.8rem;border-radius:10px;" onclick="reconnectFolder(' + inv.id + ')">Relier</button>' +
      '</div>';
    btn.disabled = true;
  }
}

// ---- Reconnect ----
async function reconnectFolder(id) {
  var inv = interventions.find(function(x){ return x.id === id; });
  if (!inv) return;
  try {
    showToast('Choisis le dossier parent...');
    var parentHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    var subDir = await parentHandle.getDirectoryHandle(inv.folderName, { create: false });
    folderHandles[id] = subDir;
    renderFolderBanner(inv);
    renderList();
    showToast('Reconnecte : ' + inv.folderName);
  } catch(e) {
    if (e.name === 'NotFoundError') showToast('Dossier "' + inv.folderName + '" introuvable ici');
    else if (e.name !== 'AbortError') showToast('Erreur : ' + e.message);
  }
}

// ---- Camera ----
function capturePhoto() {
  var inp = document.getElementById('camera-input');
  inp.value = '';
  inp.click();
}

document.getElementById('camera-input').addEventListener('change', async function(e) {
  var files = Array.from(e.target.files);
  if (!files.length || !currentId) return;

  var inv = interventions.find(function(x){ return x.id === currentId; });
  var subDir = folderHandles[currentId];
  if (!subDir) { showToast('Reconnecte le dossier !'); return; }

  if (!photoPreviews[currentId]) photoPreviews[currentId] = [];

  var saved = 0, errors = 0;

  for (var idx = 0; idx < files.length; idx++) {
    var file = files[idx];
    try {
      var nextNum = (inv.photoCount || 0) + idx + 1;
      var fileName = inv.folderName + '_' + String(nextNum).padStart(3, '0') + '.jpg';

      // Convert to ArrayBuffer (required for Android Chrome)
      var arrayBuffer = await fileToArrayBuffer(file);

      var fileHandle = await subDir.getFileHandle(fileName, { create: true });
      var writable = await fileHandle.createWritable();
      await writable.write(arrayBuffer);
      await writable.close();

      // Preview in RAM
      var url = URL.createObjectURL(file);
      photoPreviews[currentId].push({ name: fileName, url: url });
      saved++;
    } catch(err) {
      errors++;
      console.error(err);
    }
  }

  inv.photoCount = (inv.photoCount || 0) + saved;
  saveData();
  renderGrid(inv);
  renderList();
  renderFolderBanner(inv);

  if (saved) showToast(saved + ' photo' + (saved > 1 ? 's' : '') + ' enregistree' + (saved > 1 ? 's' : '') + ' !');
  if (errors) showToast('Erreur sur ' + errors + ' photo(s) — ' + (errors > 0 ? 'reconnecte le dossier' : ''));
});

function fileToArrayBuffer(file) {
  return new Promise(function(resolve, reject) {
    var r = new FileReader();
    r.onload = function(e){ resolve(e.target.result); };
    r.onerror = reject;
    r.readAsArrayBuffer(file);
  });
}

// ---- Grid ----
function renderGrid(inv) {
  var grid = document.getElementById('grid');
  var previews = photoPreviews[inv.id] || [];
  document.getElementById('d-count').textContent = inv.photoCount || 0;

  if (!previews.length) {
    grid.innerHTML = inv.photoCount > 0
      ? '<div class="no-photos"><span class="no-photos-icon">&#128194;</span><p>' + inv.photoCount + ' photo(s) dans le dossier.<br><small style="font-size:0.75rem;color:var(--muted)">Apercus disponibles pendant la session.</small></p></div>'
      : '<div class="no-photos"><span class="no-photos-icon">&#128247;</span><p>Aucune photo.<br>Appuie sur "Prendre une photo".</p></div>';
    return;
  }

  grid.innerHTML = '<div class="photo-grid">' + previews.map(function(p) {
    return '<div class="photo-item" onclick="openLightbox(\'' + p.url + '\')">' +
      '<img src="' + p.url + '" alt="' + esc(p.name) + '"/>' +
    '</div>';
  }).join('') + '</div>';
}

// ---- Delete ----
function deleteCurrent() {
  if (!confirm('Supprimer cette intervention ? (Les photos sur le telephone ne seront pas supprimees)')) return;
  interventions = interventions.filter(function(x){ return x.id !== currentId; });
  delete folderHandles[currentId];
  delete photoPreviews[currentId];
  saveData();
  goHome();
}

// ---- Home ----
function goHome() {
  document.getElementById('v-detail').classList.remove('active');
  document.getElementById('v-list').classList.add('active');
  renderList();
}

function esc(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
</body>
</html>
