<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>InterventionPro v7.1 - Corrigé</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:#05070a; --card:#12161f; --accent:#ff6b2b; --text:#ffffff;
      --muted:#808ba0; --green:#00ff88; --red:#ff5050;
      --border:rgba(255,255,255,0.08); --radius:16px;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
   .hdr{position:sticky;top:0;z-index:100;background:rgba(5,7,10,0.85);backdrop-filter:blur(16px); padding:14px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
   .logo{font-weight:800;font-size:1.15rem;}
   .logo-accent{color:var(--accent);}
   .view{display:none;padding:20px;max-width:580px;margin:0 auto;}
   .view.active{display:block;}
   .btn{border:none;border-radius:12px;font-weight:700;cursor:pointer;transition:0.15s; display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;}
   .btn:active{transform:scale(0.95);}
   .btn-primary{background:linear-gradient(135deg,var(--accent),#ff9060);color:#fff;padding:16px 22px;width:100%;}
   .btn-secondary{background:var(--card);border:1px solid var(--border);color:#fff;padding:12px 18px;}
   .btn-danger{background:rgba(255,80,80,0.15);color:var(--red);padding:10px 14px;}
   .int-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius); padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:14px;cursor:pointer;}
   .card-body{flex:1;min-width:0;}
   .card-num{font-size:0.75rem;font-weight:700;color:var(--accent);}
   .card-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
   .photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
   .photo-item{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--card);position:relative;border:1px solid var(--border);}
   .photo-item img{width:100%;height:100%;object-fit:cover;cursor:pointer;}
   .photo-del{position:absolute;top:5px;right:5px;background:var(--red);color:white;border:none;width:26px;height:26px;border-radius:50%;z-index:10;font-weight:bold;}
   .folder-banner{border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:0.85rem;}
   .linked{background:rgba(0,255,136,0.1);border:1px solid rgba(0,255,136,0.2);color:var(--green);}
   .unlinked{background:rgba(255,107,43,0.1);border:1px solid rgba(255,107,43,0.2);color:var(--accent);}
   .lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:2000;flex-direction:column;align-items:center;justify-content:center;}
   .lightbox img{max-width:95vw;max-height:80vh;object-fit:contain;border-radius:8px;}
   .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:1000;align-items:center;justify-content:center;padding:20px;}
   .modal{background:var(--card);width:100%;max-width:400px;padding:25px;border-radius:20px;}
    input{width:100%;padding:12px;margin:10px 0;background:#1a1f2b;border:1px solid var(--border);color:#fff;border-radius:10px;}
  </style>
</head>
<body>
  <div class="hdr">
    <div class="logo">📸 Inter<span class="logo-accent">Pro</span></div>
  </div>
  <div class="view active" id="v-list">
    <div style="display:flex;justify-content:space-between;margin-bottom:20px;gap:10px;">
      <button class="btn btn-secondary" id="btn-open-existing">📁 Ouvrir dossier</button>
      <button class="btn btn-primary" id="btn-new" style="width:auto">+ Nouveau</button>
    </div>
    <div id="list-container"></div>
  </div>
  <div class="view" id="v-detail">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:15px;">
      <button class="btn btn-secondary" id="btn-back">←</button>
      <div style="flex:1;">
        <div id="d-num" style="color:var(--accent);font-weight:700;font-size:0.7rem;"></div>
        <div id="d-title" style="font-weight:800;font-size:1rem;"></div>
      </div>
      <button class="btn btn-danger" id="btn-delete">🗑</button>
    </div>
    <div id="folder-banner"></div>
    <div style="margin-bottom:20px;">
      <button class="btn btn-primary" id="btn-photo">📷 PRENDRE UNE PHOTO</button>
      <button class="btn btn-secondary" id="btn-reconnect" style="margin-top:8px; width:100%;">🔗 Relier le dossier</button>
    </div>
    <div id="grid" class="photo-grid"></div>
    <input type="file" id="camera-input" accept="image/jpeg,image/png" capture="environment" style="display:none"/>
  </div>
  <div class="overlay" id="m-create">
    <div class="modal">
      <h3>Nouvelle intervention</h3>
      <input type="text" id="in-num" placeholder="Numéro intervention"/>
      <input type="text" id="in-client" placeholder="Nom du client"/>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <button class="btn btn-secondary" onclick="hideModals()">Annuler</button>
        <button class="btn btn-primary" id="btn-modal-create" style="width:auto">Créer</button>
      </div>
    </div>
  <div class="lightbox" id="lightbox">
    <img id="lb-img" src=""/>
    <button class="btn btn-secondary" style="margin-top:20px;" onclick="closeLightbox()">Fermer</button>
  </div>
<script>
const hasFileSystem = 'showDirectoryPicker' in window;
let interventions = JSON.parse(localStorage.getItem('ipro_v7') || '[]');
let folderHandles = {};
let currentId = null;
let objectURLs = []; // Pour éviter les memory leaks
if (!hasFileSystem) {
  alert("Ton navigateur ne supporte pas la gestion de dossiers. Utilise Chrome/Edge sur Android ou PC.");
}
renderList();
document.getElementById('btn-new').onclick = () => showModal('m-create');
document.getElementById('btn-back').onclick = goHome;
document.getElementById('btn-modal-create').onclick = createIntervention;
document.getElementById('btn-reconnect').onclick = () => reconnectFolder(currentId);
document.getElementById('btn-open-existing').onclick = openExistingFolder;
document.getElementById('btn-delete').onclick = deleteIntervention;
const camInput = document.getElementById('camera-input');
document.getElementById('btn-photo').onclick = () => {
  if (!hasFileSystem) return alert("Fonction non supportée sur ce navigateur.");
  if (!folderHandles[currentId]) return alert("Dossier déconnecté. Clique sur 'Relier le dossier'.");
  camInput.click();
};
camInput.onchange = async (e) => {
  const file = e.target.files[0];
  if(!file ||!currentId) return;
  const handle = folderHandles[currentId];
  try {
    const fileName = `IMG_${Date.now()}.jpg`;
    const fileHandle = await handle.getFileHandle(fileName, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(file);
    await writable.close();
    const inv = interventions.find(i => i.id === currentId);
    inv.photoCount++;
    save();
    await loadPhotos(currentId);
  } catch(err) {
    console.error(err);
    alert("Erreur d'écriture. Vérifie les permissions du dossier.");
  } finally {
    e.target.value = ''; // Reset pour pouvoir reprendre la même photo
  }
};
function escapeHTML(str) {
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
async function loadPhotos(id) {
  const grid = document.getElementById('grid');
  // Clean old URLs pour éviter memory leak
  objectURLs.forEach(URL.revokeObjectURL);
  objectURLs = [];
  grid.innerHTML = '';
  const handle = folderHandles[id];
  if(!handle) return;
  try {
    for await (const entry of handle.values()) {
      if(entry.kind === 'file' && entry.name.match(/\.(jpg|jpeg|png)$/i)) {
        const file = await entry.getFile();
        const url = URL.createObjectURL(file);
        objectURLs.push(url);
        const div = document.createElement('div');
        div.className = 'photo-item';
        div.innerHTML = `
          <img src="${url}" onclick="openLightbox('${url}')">
          <button class="photo-del" onclick="event.stopPropagation(); deletePhoto('${escapeHTML(entry.name)}')">✕</button>
        `;
        grid.appendChild(div);
      }
    }
  } catch(e) {
    console.error("Erreur lecture dossier:", e);
  }
}
async function deletePhoto(name) {
  if(!confirm("Supprimer cette photo?")) return;
  try {
    await folderHandles[currentId].removeEntry(name);
    const inv = interventions.find(i => i.id === currentId);
    inv.photoCount = Math.max(0, inv.photoCount - 1);
    save();
    await loadPhotos(currentId);
  } catch(e) {
    alert("Impossible de supprimer la photo.");
  }
}
async function createIntervention() {
  if (!hasFileSystem) return alert("Navigateur non compatible.");
  const num = document.getElementById('in-num').value.trim();
  const cli = document.getElementById('in-client').value.trim();
  if(!num ||!cli) return alert("Remplis numéro et client.");
  try {
    const parent = await window.showDirectoryPicker({ mode: 'readwrite' });
    const name = `${num}_${cli}`.replace(/[^a-z0-9_]/gi, '_');
    const handle = await parent.getDirectoryHandle(name, { create: true });
    const inv = { id: Date.now(), num, client: cli, folderName: name, photoCount: 0 };
    interventions.push(inv);
    folderHandles[inv.id] = handle;
    save();
    hideModals();
    document.getElementById('in-num').value = '';
    document.getElementById('in-client').value = '';
    renderList();
    openFolder(inv.id);
  } catch(e) {
    if (e.name!== 'AbortError') alert("Erreur : " + e.message);
  }
}
async function openExistingFolder() {
  if (!hasFileSystem) return alert("Navigateur non compatible.");
  try {
    const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
    let inv = interventions.find(i => i.folderName === handle.name);
    if(!inv) {
      const parts = handle.name.split('_');
      inv = {
        id: Date.now(),
        num: parts[0] || 'INCONNU',
        client: parts[1] || 'Client',
        folderName: handle.name,
        photoCount: 0
      };
      interventions.push(inv);
    }
    folderHandles[inv.id] = handle;
    save();
    renderList();
    openFolder(inv.id);
  } catch(e) {
    if (e.name!== 'AbortError') console.error(e);
  }
}
async function reconnectFolder(id) {
  if (!hasFileSystem) return alert("Navigateur non compatible.");
  try {
    const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
    folderHandles[id] = handle;
    renderFolderBanner(interventions.find(i => i.id === id));
    await loadPhotos(id);
  } catch(e) {
    if (e.name!== 'AbortError') console.error(e);
  }
}
function renderList() {
  const container = document.getElementById('list-container');
  container.innerHTML = '';
  interventions.slice().reverse().forEach(inv => {
    const div = document.createElement('div');
    div.className = 'int-card';
    div.onclick = () => openFolder(inv.id);
    div.innerHTML = `
      <div class="card-body">
        <div class="card-num">${escapeHTML(inv.num)}</div>
        <div class="card-name">${escapeHTML(inv.client)}</div>
      </div>
      <div>${inv.photoCount} 📷</div>`;
    container.appendChild(div);
  });
}
function openFolder(id) {
  currentId = id;
  const inv = interventions.find(i => i.id === id);
  document.getElementById('d-num').textContent = inv.num;
  document.getElementById('d-title').textContent = inv.client;
  document.getElementById('v-list').classList.remove('active');
  document.getElementById('v-detail').classList.add('active');
  renderFolderBanner(inv);
  loadPhotos(id);
}
function renderFolderBanner(inv) {
  const b = document.getElementById('folder-banner');
  const linked =!!folderHandles[inv.id];
  b.className = 'folder-banner ' + (linked? 'linked' : 'unlinked');
  b.innerHTML = linked? `✅ Dossier prêt : ${escapeHTML(inv.folderName)}` : `⚠️ Appuyez sur "Relier le dossier"`;
}
function goHome() {
  currentId = null;
  objectURLs.forEach(URL.revokeObjectURL);
  objectURLs = [];
  document.getElementById('v-detail').classList.remove('active');
  document.getElementById('v-list').classList.add('active');
  renderList();
}
function deleteIntervention() {
  if(confirm("Supprimer cette intervention? Les photos resteront dans le dossier.")) {
    interventions = interventions.filter(i => i.id!== currentId);
    delete folderHandles[currentId];
    save();
    goHome();
  }
}
function save() { localStorage.setItem('ipro_v7', JSON.stringify(interventions)); }
function showModal(id) { document.getElementById(id).style.display = 'flex'; }
function hideModals() { document.querySelectorAll('.overlay').forEach(o => o.style.display='none'); }
function openLightbox(url) {
  document.getElementById('lb-img').src = url;
  document.getElementById('lightbox').style.display = 'flex';
}
function closeLightbox() { document.getElementById('lightbox').style.display = 'none'; }
</script>
</body>
</html>
